<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="sh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sv" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#0b0d17"/>

  <!-- Diffraction spikes -->
  <rect x="6" y="30.8" width="52" height="2.4" rx="1.2" fill="url(#sh)" filter="url(#glow)"/>
  <rect x="30.8" y="6" width="2.4" height="52" rx="1.2" fill="url(#sv)" filter="url(#glow)"/>

  <!-- Center dot: glow layer + crisp core -->
  <circle cx="32" cy="32" r="6.4" fill="white" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="4" fill="#e0f2fe"/>
</svg>
