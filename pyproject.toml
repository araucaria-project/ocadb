[tool.poetry]
name = "ocadb"
version = "0.0.3"
description = "Observatory Cerro Murphy Database - astronomical object catalog management system"
authors = ["Mikolaj Kaluszynski <mkaluszynski@akond.com>"]
readme = "README.md"
license = "LGPL-3.0-or-later"
homepage = "https://github.com/araucaria-project/ocadb"
repository = "https://github.com/araucaria-project/ocadb"

# packages of the project:
#packages = [
#    { include = "ocadb"},
##    { include = "cli", from = "odbc" },
##    { include = "ocadb.models", from = "odbc" },
#    { include = "api", from = "." },
#]

[tool.poetry.dependencies]
python = "^3.12"
pydantic = "^2.6.1"
python-dotenv = "^1.1.1"
fastapi = "^0.109.2"
uvicorn = "^0.27.1"
python-multipart = "^0.0.9" # Logging shemas
python-jose = "^3.3.0"# JWT
passlib = "^1.7.4"  # for hashing password
bcrypt = "^4.1.2"  # for hashing password, needed for passlib
beanie = "^1.25.0"
rich = "^13.7.0"
serverish = "^1.0.3"
pydantic-settings = "^2.2.1"
motor = "^3.4.0"  # driver for mongodb used by api and conamdline
typer = "^0.16.0"
pyaraucaria = {git = "https://github.com/araucaria-project/pyaraucaria.git"}
aioboto3 = "^15.2.0"

[tool.poetry.extras]
# API server dependencies (includes authentication)
api = ["fastapi", "uvicorn", "python-multipart", "pydantic-settings"]
# Authentication dependencies  
auth = ["python-jose", "passlib", "bcrypt"]
# Complete server stack (API + auth)
server = ["fastapi", "uvicorn", "python-multipart", "python-jose", "passlib", "bcrypt", "pydantic-settings"]

[tool.poetry.scripts]
ocadb-server = 'api.main:start_development_server'
# start = "api.main:start"
ocadb = 'ocadb.cli.ocadb:app'

[tool.poetry.group.dev.dependencies]
fastapi = { version = "^0.109.2", extras = [] }   # [all]
uvicorn = "^0.27.1"
pytest = "^7.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
